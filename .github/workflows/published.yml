# Whether the published site (ceu-lang.org/new/) is the current one: it
# reads version.txt of the site (the commits of env-web, lang and
# env-pico that site.yml built) and fails if any of the three repos has
# changed since then in what makes the site: of env-web all but its plans,
# workflows, tests, README, Makefile and .gitignore; of lang, the compiler
# (src, rt, Makefile) and the guide with its examples; of env-pico, pico.atm,
# its C library and the examples birds and rocks. Its badge is on the
# landing page.
#
# It waits for a publish in course to end before it compares. It runs after
# each publish, and once a day (for a push that was not
# published, and for the changes in lang and env-pico). Not at each push:
# the site is published right after each change (plans, #48), so a check
# at the push would only fail before the publish ends.
name: Published
on:
  workflow_run:
    workflows: ["Publish the site"]
    types: [completed]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wait for a publish in course
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a publish that is queued or running will change what is published:
          # judge only after it (two publishes in a row made this fail in between)
          for i in $(seq 1 80); do
              n=$(gh run list --workflow site.yml --json status \
                  --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
              [ "${n:-0}" = 0 ] && break
              echo "a publish is in course ($n): waiting"
              sleep 30
          done
      - name: Compare the published site with main
        run: |
          for t in 1 2 3 4 5; do
              curl -sfL https://ceu-lang.org/new/version.txt -o version.txt && break
              sleep 30        # the host may answer 429 (too many requests)
          done
          test -s version.txt || { echo "version.txt of the site could not be read"; exit 1; }
          cat version.txt
          git clone -q --filter=blob:none https://github.com/ia-atmos/lang.git ../lang
          git clone -q --filter=blob:none https://github.com/ia-atmos/env-pico.git ../env-pico
          old=0
          while read repo sha; do
              # what of each repository makes the site (the rest, as plans, other
              # documents and tests, does not change it)
              case "$repo" in
                  env-web)  dir=.;            spec=". :(exclude).claude :(exclude).github :(exclude)tst :(exclude)README.md :(exclude)Makefile :(exclude).gitignore" ;;
                  lang)     dir=../lang;      spec="src rt Makefile doc/guide.md tst/guide" ;;
                  env-pico) dir=../env-pico;  spec="pico.atm c/src exs/birds exs/rocks" ;;
                  *)        dir=../$repo;     spec="." ;;
              esac
              if ! git -C $dir cat-file -e "$sha^{commit}" 2>/dev/null; then
                  echo "$repo: the published commit $sha is not in main"; old=1
              elif ! git -C $dir diff --quiet "$sha" HEAD -- $spec; then
                  echo "$repo: main has changed since the published commit $sha:"
                  git -C $dir log --oneline "$sha..HEAD" -- $spec | head -20
                  old=1
              else
                  echo "$repo: up to date"
              fi
          done < version.txt
          exit $old
