<!doctype html>
<html>
<head><meta charset="utf-8"><title>Atmos</title>
<style>body { margin: 8px; } pre { margin: 0; font-size: 14px; white-space: pre-wrap; } .err { color: #c00; } #end { color: #888; }</style>
</head>
<body>
<pre id="out"></pre><pre id="end"></pre>
<script>
var Module = {
    print:    (s) => { document.getElementById('out').append(s + '\n'); },
    printErr: (s) => { const e = document.createElement('span'); e.className = 'err'; e.textContent = s + '\n'; document.getElementById('out').append(e); },
    onEnd:    ()  => { document.getElementById('end').textContent = '(the program ended)'; },
};
</script>

</body>
</html>
