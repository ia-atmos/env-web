<!doctype html>
<html>
<head><meta charset="utf-8"><title>Try Atmos</title>
<style>
  /* the widths of the columns: --b is that of the code, --a that of the text of a guide (dragged by the grips) */
  :root { --a: 26em; --b: 40vw; --bar: 38px; }
  body { margin: 0; font-family: sans-serif; display: grid; grid-template-columns: var(--b) 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  body.guide { grid-template-columns: var(--a) var(--b) 1fr; }
  .grip { position: fixed; top: var(--bar); bottom: 0; width: 9px; margin-left: -5px; cursor: col-resize; z-index: 5; touch-action: none; }
  .grip:hover, .grip.on { background: rgba(6, 69, 173, .25); }
  #grip-a { display: none; left: var(--a); }
  body.guide #grip-a { display: block; }
  #grip-b { left: var(--b); }
  body.guide #grip-b { left: calc(var(--a) + var(--b)); }
  #text { display: none; padding: 0 12px; overflow: auto; border-right: 1px solid #ccc; font-size: 14px; line-height: 1.4; }
  body.guide #text { display: block; }
  #text code { background: #eee; padding: 0 2px; }
  #text pre { background: #f4f4f4; padding: 6px; overflow: auto; font-size: 12px; }
  .guide-only { display: none; }
  body.guide .guide-only { display: inline; }
  body.guide #mode { display: none; }        /* the mode of a guide is its own */
  #bar { grid-column: 1 / -1; padding: 6px 10px; background: #eee; border-bottom: 1px solid #ccc; display: flex; align-items: center; gap: .4em; flex-wrap: wrap; }
  #home img { height: 22px; display: block; margin-right: .4em; }
  #code { font-family: monospace; font-size: 14px; padding: 8px; border: 0; border-right: 1px solid #ccc; resize: none; outline: none; tab-size: 4; }
  #out { position: relative; min-height: 0; }
  #runner { width: 100%; height: 100%; border: 0; background: #f8f8f8; display: block; }
  /* the errors of the compiler, in the place of the output */
  #log { display: none; position: absolute; inset: 0; margin: 0; padding: 10px; overflow: auto; background: #fff; color: #b00; font-size: 13px; white-space: pre-wrap; }
  #log.error { display: block; }
  #busy { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-size: 18px; color: #555; }
  #busy[hidden] { display: none; }
  .sample { display: none; }
</style>
</head>
<body id="body">
<div id="bar">
  <a id="home" href="../" title="Structured Reactive Concurrency"><img src="../imgs/atmos-logo.png" alt="Atmos"></a>
  <select id="mode">
    <option value="text">text (print and time)</option>
    <option value="web">web (the DOM)</option>
    <option value="pico">pico (graphics)</option>
  </select>
  <span class="guide-only">
    <select id="guides" onchange="location.href = 'guide/' + this.value + '/'"><option>GUIDES</option></select>
    <button id="prev">&lt;</button>
    <select id="step"></select>
    <button id="next">&gt;</button>
    <button id="reset" title="Back to the program of this step">Reset</button>
  </span>
  <button id="run">Run</button>
  <button id="stop" title="Stop the program">Stop</button>
</div>
<div class="grip" id="grip-a" title="Drag to resize"></div>
<div class="grip" id="grip-b" title="Drag to resize"></div>
<div id="text"></div>
<textarea id="code" spellcheck="false"></textarea>
<div id="out">
  <iframe id="runner"></iframe>
  <pre id="log"></pre>
  <div id="busy" hidden>&#x231B; compiling...</div>
</div>

<textarea class="sample" id="sample-web">;; The DOM: `web.new`, `web.set`, events by id.

web.new(:p, [
    web.new(:button, [id="inc", text="+1"]),
    web.new(:span,   [id="count", text=" 0"]),
])
web.new(:p, [id="secs", text="0 s"])

spawn {
    var s = 0
    loop {
        await 1s
        set s += 1
        web.set("secs", "text", tostring(s) ++ " s")
    }
}

var n = 0
loop on :click [id="inc"] {
    set n += 1
    web.set("count", "text", " " ++ tostring(n))
}
</textarea>
<textarea class="sample" id="sample-text">;; Only `print` and time.

print "Counts 3 seconds:"
loop i in 3 {
    await 1s
    print(i + 1)
}
print "done"
</textarea>
<textarea class="sample" id="sample-pico">;; pico: click on the picture first, then press a key to end.

pico.open()

spawn {
    loop on :draw {
        pico.output.draw.rect ['%', x=0.5, y=0.5, w=0.5, h=0.5]
    }
}

await(:key.dn)
</textarea>
<script>
// The columns are resized by dragging their borders (the grips): the
// layout only, apart from the program of the page (ide.atm).
(function () {
    const root = document.documentElement;
    const get = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    for (const k of ['a', 'b']) {
        const v = get('atmos-col-' + k);
        if (v) { root.style.setProperty('--' + k, v); }
    }
    root.style.setProperty('--bar', document.getElementById('bar').offsetHeight + 'px');
    const grip = (id, k) => {
        const g = document.getElementById(id);
        g.addEventListener('pointerdown', (e) => {
            g.setPointerCapture(e.pointerId);
            g.classList.add('on');
            e.preventDefault();
        });
        g.addEventListener('pointermove', (e) => {
            if (!g.classList.contains('on')) { return; }
            // the left edge of the column, and the room that is left
            const guide = document.body.classList.contains('guide');
            const x0 = (k === 'a' || !guide) ? 0 : document.getElementById('text').getBoundingClientRect().right;
            const w = Math.max(120, Math.min(e.clientX - x0, window.innerWidth - x0 - 120));
            root.style.setProperty('--' + k, w + 'px');
        });
        g.addEventListener('pointerup', () => {
            g.classList.remove('on');
            put('atmos-col-' + k, getComputedStyle(root).getPropertyValue('--' + k).trim());
        });
    };
    grip('grip-a', 'a');
    grip('grip-b', 'b');
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
