<!doctype html>
<html>
<head><meta charset="utf-8"><title>Atmos IDE</title>
<style>
  body { margin: 0; font-family: sans-serif; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; height: 100vh; }
  #bar { grid-column: 1 / 3; padding: 6px 10px; background: #eee; border-bottom: 1px solid #ccc; }
  #code { font-family: monospace; font-size: 14px; padding: 8px; border: 0; border-right: 1px solid #ccc; resize: none; outline: none; tab-size: 4; }
  #runner { width: 100%; height: 100%; border: 0; background: #f8f8f8; }
  #log { grid-column: 1 / 3; margin: 0; padding: 6px 10px; max-height: 30vh; overflow: auto; background: #222; color: #ddd; font-size: 12px; white-space: pre-wrap; }
  #log.error { color: #f88; }
  .sample { display: none; }
</style>
</head>
<body>
<div id="bar">
  <b>Atmos</b>
  <select id="mode">
    <option value="web">web (the DOM)</option>
    <option value="pico">pico (graphics)</option>
  </select>
  <button id="run">Run</button>
  <span id="status"></span>
</div>
<textarea id="code" spellcheck="false"></textarea>
<iframe id="runner"></iframe>
<pre id="log"></pre>

<textarea class="sample" id="sample-web">;; The DOM: `web.new`, `web.set`, events by id.

web.new(:p, [
    web.new(:button, [id="inc", text="+1"]),
    web.new(:span,   [id="count", text=" 0"]),
])
web.new(:p, [id="secs", text="0 s"])

spawn {
    var s = 0
    loop {
        await 1s
        set s += 1
        web.set("secs", "text", tostring(s) ++ " s")
    }
}

var n = 0
loop on :click [id="inc"] {
    set n += 1
    web.set("count", "text", " " ++ tostring(n))
}
</textarea>
<textarea class="sample" id="sample-pico">;; pico: click on the picture first, then press a key to end.

pico.open()

spawn {
    loop on :draw {
        pico.output.draw.rect ['%', x=0.5, y=0.5, w=0.5, h=0.5]
    }
}

await(:key.dn)
</textarea>
{{{ SCRIPT }}}
</body>
</html>
