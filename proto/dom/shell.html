<!doctype html>
<html><head><meta charset="utf-8"><title>Atmos DOM prototype</title></head>
<body>
<p>status: <span id="msg">loading</span></p>
<p>count: <span id="count">0</span> <button id="inc">+1</button></p>
<p>seconds: <span id="secs">0</span></p>
<p><button id="stop">stop</button></p>
<pre id="out"></pre>
<script>
var Module = {
    print: (s) => { document.getElementById('out').textContent += s + '\n'; console.log(s); },
    printErr: (s) => { document.getElementById('out').textContent += s + '\n'; console.error(s); },
    status: 0,
    webEvent: (t, i) => {
        if (Module.status === 0) Module.status = Module._web_event_js(t, i);
    },
    onRuntimeInitialized: () => {
        Module._web_event_js = Module.cwrap('web_event', 'number', ['string','string']);
        let prv = performance.now();
        const frame = (now) => {
            if (Module.status !== 0) return;
            Module.status = Module._web_time(now - prv);
            prv = now;
            requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
    },
};
</script>
{{{ SCRIPT }}}
</body></html>
